services:

  app:
    build: .

    container_name: knowledgebase-ai

    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./chroma_db:/app/chroma_db
      - hf_cache:/root/.cache/huggingface

    ports:
      - "8000:8000"

    command:
      uvicorn app.api:app
      --host 0.0.0.0
      --port 8000


volumes:

  hf_cache: